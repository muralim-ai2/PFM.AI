# Team shapes to deploy or benchmark. Any model id the provider accepts works.
# `extra` is passed straight to the provider call (e.g. thinking/effort settings).
judge: {model: claude-sonnet-5-5, extra: {}}
teams:
  frontier:          # one or a few high-reasoning frontier agents
    lead: {model: claude-opus-5-5, extra: {}}
    workers: {model: claude-opus-5-5, count: 2, extra: {}}
  swarm:             # many small models, guided by a frontier lead
    lead: {model: claude-fable-5-2, extra: {}}
    workers: {model: claude-haiku-5-5, count: 12, extra: {}}
